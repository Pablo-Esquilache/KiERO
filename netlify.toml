[build]
  command = "npm install --prefix backend && npm run build --prefix backend"
  publish = "frontend"

[functions]
  directory = "backend/dist"
  
  

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
